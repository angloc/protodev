# GitHub Actions workflow to build, test, and push container image
# Tests must pass before any image is pushed to the registry
# Creates a devcontainer.zip for releases

name: Build, Test, and Push Container

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Build the container image
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with 'latest' for main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Semantic version tags (v1.0.0 -> 1.0.0, 1.0, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            # Branch name for PRs and non-main branches
            type=ref,event=branch
            type=ref,event=pr
            # Short SHA for all builds
            type=sha,prefix=-

      - name: Build container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # Job 2: Run tests (depends on build)
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load container image
        run: docker load --input /tmp/image.tar

      - name: Start container for testing
        run: |
          docker run -d --name protodev \
            --privileged \
            --shm-size=2gb \
            --network=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/workspace \
            -e DISPLAY=:100 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            --workdir /workspace \
            protodev-test \
            bash -c 'bash /workspace/.devcontainer/postStartCommand.sh && tail -f /dev/null'

      - name: Wait for container startup
        run: sleep 10

      - name: Install test dependencies in container
        run: docker exec protodev pip install pytest

      - name: Run container tests
        run: docker exec protodev pytest /workspace/tests/ -v --tb=short

      - name: Cleanup containers
        if: always()
        run: |
          docker rm -f protodev 2>/dev/null || true
          docker system prune -f || true

  # Job 3: Push to registry (depends on tests passing)
  push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with 'latest' for main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Semantic version tags (v1.0.0 -> 1.0.0, 1.0, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            # Branch name for PRs and non-main branches
            type=ref,event=branch
            type=ref,event=pr
            # Short SHA for all builds
            type=sha,prefix=-

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pin devcontainer image to the exact release tag (for tagged releases only)
      - name: Pin devcontainer image to release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s|ghcr.io/angloc/protodev:latest|ghcr.io/angloc/protodev:${VERSION}|g" \
            .devcontainer/devcontainer.json
          echo "Pinned devcontainer image to: ghcr.io/angloc/protodev:${VERSION}"

      # Create devcontainer.zip from the .devcontainer folder
      - name: Create devcontainer.zip
        run: |
          zip -r devcontainer.zip .devcontainer
          echo "Created devcontainer.zip with contents:"
          unzip -l devcontainer.zip

      # Upload zip as artifact
      - name: Upload devcontainer.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: devcontainer
          path: devcontainer.zip
          retention-days: 30

      # Attach zip to GitHub Release (only for tagged releases)
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: devcontainer.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
